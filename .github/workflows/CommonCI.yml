name: Common Onion CI Workflow

on:
  workflow_call:
    inputs:
      julia_version:
        required: true
        type: string
      project:
        required: true
        type: string
      downgrade_testing:
        required: false
        type: boolean
        default: false
      local_dependencies:
        required: false
        type: string
        default: ""
      local_test_dependencies:
        required: false
        type: string
        default: ""
      test_args:
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia_version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache-${{ inputs.julia_version }}-${{ inputs.project }}-${{ inputs.downgrade_testing }}-${{ inputs.local_dependencies }}-${{ inputs.local_test_dependencies }}-${{ inputs.test_args }}
      - name: Add registries
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(Pkg.Registry.RegistrySpec(url="https://github.com/JuliaRegistries/General"))
          Pkg.Registry.add(Pkg.Registry.RegistrySpec(url="https://github.com/MurrellGroup/MurrellGroupRegistry"))
      - uses: julia-actions/julia-downgrade-compat@v2.5
        if: ${{ inputs.downgrade_testing }}
        with:
          mode: forcedeps
          projects: ${{ inputs.project }}
          julia_version: ${{ inputs.julia_version }}
          skip: Pkg, TOML, Statistics, LinearAlgebra, Random, Serialization, Markdown, Test, UUIDs, Onion, OnionCore, OnionStyle
      - name: Develop local dependencies
        if: ${{ inputs.local_dependencies != '' }}
        shell: julia --color=yes {0}
        env:
          PROJECT: ${{ inputs.project }}
          DEV_DEPS: ${{ inputs.local_dependencies }}
        run: |
          using Pkg
          Pkg.activate(ENV["PROJECT"])
          for path in filter(!isempty, split(ENV["DEV_DEPS"], ","))
              Pkg.develop(PackageSpec(path=path))
          end
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ inputs.project }}
      - name: Develop local test dependencies
        if: ${{ inputs.local_test_dependencies != '' }}
        shell: julia --color=yes {0}
        env:
          PROJECT: ${{ inputs.project }}
          TEST_DEPS: ${{ inputs.local_test_dependencies }}
        run: |
          using Pkg
          project = ENV["PROJECT"]
          Pkg.activate(joinpath(project, "test"))
          Pkg.develop(PackageSpec(path=project))
          for path in filter(!isempty, split(ENV["TEST_DEPS"], ","))
              Pkg.develop(PackageSpec(path=path))
          end
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ inputs.project }}
          test_args: ${{ inputs.test_args }}
          allow_reresolve: ${{ !inputs.downgrade_testing }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
