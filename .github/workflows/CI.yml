name: CI (Onion)

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/CommonCI.yml"
      - ".github/workflows/CI.yml"
      - "Project.toml"
      - "src/**"
      - "ext/**"
      - "test/**"
      - "docs/**"
      - "lib/OnionCore/src/**"
      - "lib/OnionCore/ext/**"
      - "lib/OnionCore/Project.toml"
      - "lib/OnionStyle/src/**"
      - "lib/OnionStyle/ext/**"
      - "lib/OnionStyle/Project.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: "1.12"
      project: "."
      local_dependencies: "lib/OnionCore,lib/OnionStyle"
      local_test_dependencies: "lib/OnionCore,lib/OnionStyle"

  downgrade:
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: "1.11"
      project: "."
      downgrade_testing: true
      local_dependencies: "lib/OnionCore,lib/OnionStyle"
      local_test_dependencies: "lib/OnionCore,lib/OnionStyle"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(Pkg.Registry.RegistrySpec(url="https://github.com/JuliaRegistries/General"))
          Pkg.Registry.add(Pkg.Registry.RegistrySpec(url="https://github.com/MurrellGroup/MurrellGroupRegistry"))
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.develop(PackageSpec(path=joinpath(pwd(), "lib", "OnionCore")))
          Pkg.develop(PackageSpec(path=joinpath(pwd(), "lib", "OnionStyle")))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using Onion
          DocMeta.setdocmeta!(Onion, :DocTestSetup, :(using Onion); recursive=true)
          doctest(Onion)
